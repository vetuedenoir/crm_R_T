services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # `:?` fait échouer `docker compose` avec un message clair si `.env` n'a pas été créé.
      POSTGRES_USER: ${POSTGRES_USER:?copier .env.example en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copier .env.example en .env}
      POSTGRES_DB: ${POSTGRES_DB:?copier .env.example en .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-crm_test}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
